# MongoDB backing the backend service (users collection).
#
# Single replica with a local-path volume: the k3s VPS has one node, so there
# is nothing to replicate to. Data lives in /var/lib/rancher/k3s/storage and is
# included in the documented cluster backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: squidcode-mongo-data
  namespace: squidcode
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squidcode-mongo
  namespace: squidcode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: squidcode-mongo
  template:
    metadata:
      labels:
        app: squidcode-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "768Mi"
              cpu: "700m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: squidcode-mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: squidcode-mongo
  namespace: squidcode
spec:
  type: ClusterIP
  selector:
    app: squidcode-mongo
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
