apiVersion: v1
kind: Service
metadata:
  name: squidcode-frontend-service
  namespace: apps
spec:
  type: NodePort
  selector:
    app: squidcode-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      # NodePorts are bound on loopback only; the public entry point is Caddy.
      nodePort: 30090
