apiVersion: v1
kind: Service
metadata:
  name: squidcode-leetcode-service
  namespace: squidcode
spec:
  selector:
    app: squidcode-leetcode
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      # NodePorts are bound on loopback only; the public entry point is Caddy.
      nodePort: 30092
  type: NodePort
