apiVersion: v1
kind: Service
metadata:
  name: squidcode-backend-service
  namespace: squidcode
spec:
  type: NodePort
  selector:
    app: squidcode-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      # NodePorts are bound on loopback only; the public entry point is Caddy.
      nodePort: 30091
