micronaut:
  application:
    name: squidcode-backend
  server:
    port: 8000
    max-request-size: '100MB'
    multipart:
      max-file-size: '100MB'
    cors:
      enabled: true
      configuration:
        allowedOrigins:
          - ${CORS_ALLOWED_ORIGIN:`http://localhost:*`}
          - ${CORS_ALLOWED_ORIGIN_2:`http://localhost:8080`}
        allowedMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowedHeaders:
          - Content-Type
          - Authorization
          - Origin
          - Accept
          - X-Requested-With
          - X-CSRF-TOKEN
          - X-Auth-Token
          - X-XSRF-TOKEN

google:
  client-id: ${GOOGLE_CLIENT_ID:}

# MongoDB Configuration
mongodb:
  uri: ${MONGODB_URI:`mongodb://localhost:27017/squidcode`}

# RabbitMQ Configuration
rabbitmq:
  uri: ${RABBITMQ_URI:`amqp://guest:guest@localhost:5672`}

