name: backend-service

on:
  push:
    paths:
      - services/backend-service/application/**
      - services/backend-service/infrastructure/**
      - .github/workflows/backend-service.yml
  pull_request:
    paths:
      - services/backend-service/application/**
      - services/backend-service/infrastructure/**

env:
  applicationPath: services/backend-service/application
  kubernetesPath: services/backend-service/infrastructure/kubernetes
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'squidcode' }}
  deployment: squidcode-backend
  container: squidcode-backend
  registry: ghcr.io
  image: ghcr.io/alemazzo/squid-code/backend
  platforms: linux/amd64
  siteUrl: https://api.squidcode.5-175-171-84.sslip.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@v7

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '24.0.2+12'

      - name: setup-gradle
        uses: gradle/actions/setup-gradle@v6

      - name: build
        working-directory: ${{ env.applicationPath }}
        run: ./gradlew build

      - name: test
        working-directory: ${{ env.applicationPath }}
        run: ./gradlew test

  release:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-qemu
        uses: docker/setup-qemu-action@v4

      - name: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: login-registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.applicationPath }}
          file: ${{ env.applicationPath }}/Dockerfile
          platforms: ${{ env.platforms }}
          push: true
          tags: |
            ${{ env.image }}:latest
            ${{ env.image }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    concurrency: backend-service-deploy

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-ssh
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: deploy
        run: |
          export SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          HOST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          ssh $SSH_OPTS "$HOST" "kubectl -n \"$K8S_NAMESPACE\" apply -f -" < ${kubernetesPath}/deployment.yaml
          ssh $SSH_OPTS "$HOST" "kubectl -n \"$K8S_NAMESPACE\" apply -f -" < ${kubernetesPath}/service.yaml
          ssh $SSH_OPTS "$HOST" "kubectl -n \"$K8S_NAMESPACE\" set image deployment/${deployment} ${container}=${image}:${GITHUB_SHA}"
          ssh $SSH_OPTS "$HOST" "kubectl -n \"$K8S_NAMESPACE\" rollout status deployment/${deployment} --timeout=300s"

      - name: smoke-test
        run: |
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              -X POST "${siteUrl}/submissions/" \
              -H 'Content-Type: application/json' \
              -d '{"problemId":"two-sum","code":"print(1)","language":"python"}' || true)"
            [ "$code" = "201" ] && { echo "${siteUrl} -> HTTP ${code}"; exit 0; }
            sleep 5
          done
          echo "smoke test fallito: HTTP ${code:-nessuna risposta}"
          exit 1
