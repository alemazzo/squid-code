name: frontend-service

on:
  push:
    paths:
      - services/frontend-service/application/**
      - services/frontend-service/infrastructure/**
      - .github/workflows/frontend-service.yml
  pull_request:
    paths:
      - services/frontend-service/application/**
      - services/frontend-service/infrastructure/**

env:
  applicationPath: services/frontend-service/application
  kubernetesPath: services/frontend-service/infrastructure/kubernetes
  deployment: squidcode-frontend
  container: squidcode-frontend
  registry: ghcr.io
  image: ghcr.io/alemazzo/squid-code/frontend
  platforms: linux/amd64
  siteUrl: https://squidcode.5-175-171-84.sslip.io
  backendUrl: https://api.squidcode.5-175-171-84.sslip.io
  leetcodeUrl: https://leetcode.squidcode.5-175-171-84.sslip.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install
        working-directory: ${{ env.applicationPath }}
        run: npm install

      - name: build
        working-directory: ${{ env.applicationPath }}
        run: npm run build

      # The bundle is loaded in a real browser: fail the build when the page
      # does not mount (e.g. a router that is incompatible with the Svelte
      # version in use) instead of shipping a blank page.
      - name: install-browsers
        working-directory: ${{ env.applicationPath }}
        run: npx playwright install --with-deps chromium

      - name: smoke-test
        working-directory: ${{ env.applicationPath }}
        run: npm run smoke

  release:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-qemu
        uses: docker/setup-qemu-action@v4

      - name: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: login-registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The API endpoints are baked into the bundle: pass them as build args.
      - name: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.applicationPath }}
          file: ${{ env.applicationPath }}/Dockerfile
          platforms: ${{ env.platforms }}
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.backendUrl }}
            VITE_LEETCODE_BASE_URL=${{ env.leetcodeUrl }}
          tags: |
            ${{ env.image }}:latest
            ${{ env.image }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    concurrency: frontend-service-deploy

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-ssh
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: deploy
        run: |
          export SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          HOST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          ssh $SSH_OPTS "$HOST" "kubectl -n apps apply -f -" < ${kubernetesPath}/deployment.yaml
          ssh $SSH_OPTS "$HOST" "kubectl -n apps apply -f -" < ${kubernetesPath}/service.yaml
          ssh $SSH_OPTS "$HOST" "kubectl -n apps set image deployment/${deployment} ${container}=${image}:${GITHUB_SHA}"
          ssh $SSH_OPTS "$HOST" "kubectl -n apps rollout status deployment/${deployment} --timeout=300s"

      - name: smoke-test
        run: |
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${siteUrl}/" || true)"
            [ "$code" = "200" ] && { echo "${siteUrl} -> HTTP ${code}"; exit 0; }
            sleep 5
          done
          echo "smoke test fallito: HTTP ${code:-nessuna risposta}"
          exit 1
